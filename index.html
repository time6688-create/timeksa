<!DOCTYPE html>
<html lang="vi">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>

            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* Ẩn thanh cuộn ngang cho bộ lọc trên điện thoại */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Thanh cuộn tùy chỉnh cho danh sách dài */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-20 sm:pb-0">

    </header>

                    <!-- Các nút lọc thành phố sẽ được render bằng JS -->
                </div>
                <button onclick="copyAllVisibleProxies()" class="w-full sm:w-auto justify-center px-4 py-3 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2 shrink-0">

                <!-- Nội dung Danh bạ được render từ JS -->

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }

        function copyText(text, successMessage = 'Đã sao chép vào bộ nhớ tạm!') {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                textarea.setSelectionRange(0, 99999);
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(successMessage);
            } catch (err) {
                console.error('Lỗi sao chép:', err);
                showToast('Không thể sao chép tự động, vui lòng bôi đen và copy thủ công.');
            }
        }

        function downloadFile(fileName, content, mimeType = 'text/plain;charset=utf-8') {
            try {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast(`Đang tải xuống: ${fileName}`);
            } catch (err) {
                console.error('Lỗi tải xuống:', err);
                showToast('Có lỗi khi tạo tệp tải xuống.');
            }
        }

        function parseVcfContacts(vcfText) {
            const cards = vcfText.split('BEGIN:VCARD').slice(1);
            const contacts = [];
            cards.forEach(card => {
                const fnMatch = card.match(/^FN:(.*)$/m);
                const orgMatch = card.match(/^ORG:(.*)$/m);
                const telMatch = card.match(/^TEL[^:]*:(.*)$/m);
                const name = fnMatch
                    ? fnMatch[1].trim()
                    : (orgMatch ? orgMatch[1].replace(/;+$/, '').trim() : 'Không tên');
                const phone = telMatch ? telMatch[1].trim() : '';
                if (phone) {
                    contacts.push({ name, phone });
                }
            });
            return contacts;
        }

                        <button onclick="downloadVcfFile('${file.id}')" class="w-full sm:w-auto justify-center px-4 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-xs sm:text-sm font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2 shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            <span>Tải xuống .VCF</span>
                        </button>
                    </div>

                    <!-- Bảng xem trước danh bạ -->
                    <div class="divide-y divide-slate-100 max-h-72 overflow-y-auto">
                        ${file.matchedContacts.map((contact) => `
                            <div class="px-4 sm:px-5 py-3 sm:py-2.5 hover:bg-slate-50 transition-colors flex items-center justify-between gap-3">
                                <div class="min-w-0 flex-1">
                                    <p class="text-sm font-medium text-slate-800 truncate">${contact.name}</p>
                                    <p class="text-xs font-mono text-slate-500 mt-0.5">${contact.phone}</p>
                                </div>
                                <button onclick="copyText('${contact.phone}', 'Đã sao chép số: ${contact.phone}')" 
                                    class="px-3 py-2 sm:px-2.5 sm:py-1 text-xs font-semibold text-blue-600 bg-blue-50/70 sm:bg-transparent sm:text-slate-600 hover:text-blue-600 hover:bg-blue-50 active:scale-95 border border-blue-200/70 sm:border-slate-200 rounded-xl sm:rounded-lg transition-all shrink-0">
                                    Sao chép
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function downloadVcfFile(fileId) {
            const file = vcfFiles.find(f => f.id === fileId);
            if (file) {
                downloadFile(file.fileName, file.content, 'text/vcard;charset=utf-8');
            }
        }

        // Khởi tạo giao diện khi tải trang
        window.addEventListener('DOMContentLoaded', () => {
            renderCityFilters();
            renderProxies();
            renderContacts();
        });
    </script>
</body>
</html>
