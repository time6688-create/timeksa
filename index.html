            return rows.map(([fn, tel, org]) => {
                const lines = [
                    'BEGIN:VCARD',
                    'VERSION:3.0',
                    `FN:${fn}`,
                    `N:;${fn};;;`,
                    `TEL;TYPE=CELL:${tel}`
                ];
                if (org) lines.push(`ORG:${org}`);
                lines.push('CATEGORIES:myContacts', 'END:VCARD');
                return lines.join('\r\n');

        const MAX_CONTACTS_PER_PART = 20;
        let currentCityFilter = 'ALL';
        let currentContactMode = 'CITY'; // 'CITY': Gộp theo khu vực + lọc trùng + chia ≤ 20 số | 'ORIGINAL': Chia từng tệp gốc ≤ 20 số

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            toast.classList.remove('translate-y-24', 'opacity-0');
            
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 2500);
        }

        function copyText(text, successMessage = 'Đã sao chép vào bộ nhớ tạm!') {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                textarea.setSelectionRange(0, 99999);
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(successMessage);
            } catch (err) {
                console.error('Lỗi sao chép:', err);
                showToast('Không thể sao chép tự động, vui lòng bôi đen và copy thủ công.');
            }
        }

        function downloadFile(fileName, content, mimeType = 'text/plain;charset=utf-8') {
            try {
                const blob = new Blob([content], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                showToast(`Đang tải xuống: ${fileName}`);
            } catch (err) {
                console.error('Lỗi tải xuống:', err);
                showToast('Có lỗi khi tạo tệp tải xuống.');
            }
        }

        function parseVcfContacts(vcfText) {
            const rawBlocks = vcfText
                .split(/(?=BEGIN:VCARD)/g)
                .map(b => b.trim())
                .filter(b => b.startsWith('BEGIN:VCARD'));
            const contacts = [];
            rawBlocks.forEach(block => {
                const fnMatch = block.match(/^FN:(.*)$/m);
                const orgMatch = block.match(/^ORG:(.*)$/m);
                const telMatch = block.match(/^TEL[^:]*:(.*)$/m);
                const name = fnMatch
                    ? fnMatch[1].trim()
                    : (orgMatch ? orgMatch[1].replace(/;+$/, '').trim() : 'Không tên');
                const phone = telMatch ? telMatch[1].trim() : '';
                if (phone) {
                    contacts.push({ name, phone, rawVcard: block });
                }
            });
            return contacts;
        }

        function getContactCity(tag) {
            if (tag.startsWith('Buraydah')) return 'Buraydah';
            if (tag.startsWith('Jeddah')) return 'Jeddah';
            if (tag.startsWith('Riyadh')) return 'Riyadh';
            if (tag.startsWith('Dammam')) return 'Dammam';
            if (tag.startsWith('Hofuf')) return 'Hofuf';
            if (tag.startsWith('Khobar')) return 'Khobar';
            return tag;
        }

        // Tiền xử lý danh sách liên hệ cho từng tệp VCF
        const parsedVcfFiles = vcfFiles.map(file => ({
            ...file,

            contacts: parseVcfContacts(file.content)
        }));

        // Chia danh bạ thành nhiều phần, mỗi phần không quá 20 số
        function buildContactParts(mode) {
            const parts = [];

            if (mode === 'CITY') {
                const cityOrder = ['Buraydah', 'Jeddah', 'Riyadh', 'Dammam', 'Hofuf', 'Khobar'];
                const cityGroups = {};
                const seenPhonesByCity = {};

                parsedVcfFiles.forEach(file => {
                    const city = file.city;
                    if (!cityGroups[city]) {
                        cityGroups[city] = [];
                        seenPhonesByCity[city] = new Set();
                    }
                    file.contacts.forEach(contact => {
                        // Lọc số trùng lặp trong cùng khu vực để danh bạ gọn gàng
                        const normalizedPhone = contact.phone.replace(/[\s\-()]/g, '');
                        if (!seenPhonesByCity[city].has(normalizedPhone)) {
                            seenPhonesByCity[city].add(normalizedPhone);
                            cityGroups[city].push(contact);
                        }
                    });
                });

                const orderedCities = [
                    ...cityOrder.filter(c => cityGroups[c] && cityGroups[c].length > 0),
                    ...Object.keys(cityGroups).filter(c => !cityOrder.includes(c))
                ];

                orderedCities.forEach(city => {
                    const list = cityGroups[city];
                    const totalParts = Math.ceil(list.length / MAX_CONTACTS_PER_PART);
                    for (let i = 0; i < totalParts; i++) {
                        const chunk = list.slice(i * MAX_CONTACTS_PER_PART, (i + 1) * MAX_CONTACTS_PER_PART);
                        const partNum = i + 1;
                        parts.push({
                            id: `city-${city.toLowerCase()}-${partNum}`,
                            title: `${city} ${partNum}`,
                            fileName: `${city} ${partNum}.vcf`,
                            city: city,
                            tag: `${city} • Phần ${partNum}/${totalParts}`,
                            contacts: chunk,
                            content: chunk.map(c => c.rawVcard).join('\r\n')
                        });
                    }
                });
            } else {
                parsedVcfFiles.forEach(file => {
                    const baseName = file.fileName.replace(/\.vcf$/i, '');
                    const list = file.contacts;
                    const totalParts = Math.ceil(list.length / MAX_CONTACTS_PER_PART);
                    for (let i = 0; i < totalParts; i++) {
                        const chunk = list.slice(i * MAX_CONTACTS_PER_PART, (i + 1) * MAX_CONTACTS_PER_PART);
                        const partNum = i + 1;
                        const suffix = totalParts > 1 ? ` ${partNum}` : '';
                        parts.push({
                            id: `${file.id}-part-${partNum}`,
                            title: `${baseName}${suffix}`,
                            fileName: `${baseName}${suffix}.vcf`,
                            city: file.city,
                            tag: totalParts > 1 ? `${file.tag} • Phần ${partNum}/${totalParts}` : file.tag,
                            contacts: chunk,
                            content: chunk.map(c => c.rawVcard).join('\r\n')
                        });
                    }
                });
            }

            return parts;
        }

        const contactPartsByCity = buildContactParts('CITY');

        function getCurrentContactParts() {

                return `
                    <button onclick="setContactCityFilter('${city}')" 
                        class="px-4 py-2.5 sm:py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 transition-all active:scale-95 ${
                            isActive 
                            ? 'bg-blue-600 text-white shadow-sm' 
                            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                        }">
                        ${label}
                    </button>
                `;
            }).join('');
        }

        function renderContacts() {
            const container = document.getElementById('contacts-container');
            const query = (document.getElementById('contact-search').value || '').toLowerCase().trim();
            let totalMatched = 0;

            const baseParts = getCurrentContactParts().filter(part => 
                currentContactCityFilter === 'ALL' || part.city === currentContactCityFilter
            );

            const filteredParts = baseParts.map(part => {
                const partMetaMatch =
                    part.title.toLowerCase().includes(query) ||
                    part.fileName.toLowerCase().includes(query) ||
                    part.tag.toLowerCase().includes(query);

                const matchedContacts = (!query || partMetaMatch)
                    ? part.contacts
                    : part.contacts.filter(c =>
                        c.name.toLowerCase().includes(query) ||
                        c.phone.toLowerCase().includes(query)
                    );

                totalMatched += matchedContacts.length;
                return { ...part, matchedContacts };
            }).filter(part => part.matchedContacts.length > 0);

            activeContactParts = filteredParts;
            document.getElementById('total-contacts-count').textContent = totalMatched;
            document.getElementById('total-parts-count').textContent = filteredParts.length;

            if (filteredParts.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white rounded-2xl border border-slate-200 p-10 text-center">
                        <p class="text-slate-500 text-sm">Không tìm thấy liên hệ hoặc phần danh bạ nào khớp với từ khóa "<span class="font-semibold text-slate-800">${escapeHtml(query)}</span>".</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredParts.map(part => `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                    <!-- Header từng phần danh bạ (≤ 20 số) -->
                    <div class="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center shrink-0 font-bold text-sm">
                                ${part.matchedContacts.length}
                            </div>
                            <div class="min-w-0 flex-1">
                                <h3 class="font-bold text-slate-900 text-sm sm:text-base truncate">${escapeHtml(part.title)}</h3>
                                <div class="flex items-center gap-2 mt-0.5 flex-wrap">
                                    <span class="text-xs font-medium text-blue-700 bg-blue-100/80 px-2 py-0.5 rounded-md">${escapeHtml(part.tag)}</span>
                                    <span class="text-xs text-slate-500">• ${part.matchedContacts.length} số</span>
                                </div>
                            </div>
                        </div>

                        <button onclick="downloadVcfFile('${part.id}')" class="w-full sm:w-auto justify-center px-4 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-xs sm:text-sm font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2 shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            <span>Tải ${escapeHtml(part.fileName)}</span>
                        </button>
                    </div>

                    <!-- Bảng xem trước danh bạ (tối đa 20 số) -->
                    <div class="divide-y divide-slate-100 max-h-64 overflow-y-auto">
                        ${part.matchedContacts.map((contact, idx) => `
                            <div class="px-4 sm:px-5 py-3 sm:py-2.5 hover:bg-slate-50 transition-colors flex items-center justify-between gap-3">
                                <div class="min-w-0 flex-1 flex items-start gap-2.5">
                                    <span class="text-[11px] font-mono text-slate-400 pt-0.5 w-5 shrink-0">${idx + 1}.</span>
                                    <div class="min-w-0 flex-1">
                                        <p class="text-sm font-medium text-slate-800 truncate">${escapeHtml(contact.name)}</p>
                                        <p class="text-xs font-mono text-slate-500 mt-0.5">${escapeHtml(contact.phone)}</p>
                                    </div>
                                </div>
                                <button onclick="copyText('${contact.phone}', 'Đã sao chép số: ${contact.phone}')" 
                                    class="px-3 py-2 sm:px-2.5 sm:py-1 text-xs font-semibold text-blue-600 bg-blue-50/70 sm:bg-transparent sm:text-slate-600 hover:text-blue-600 hover:bg-blue-50 active:scale-95 border border-blue-200/70 sm:border-slate-200 rounded-xl sm:rounded-lg transition-all shrink-0">
                                    Sao chép
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function downloadVcfFile(partId) {
            const part = getCurrentContactParts().find(p => p.id === partId);
            if (part) {
                downloadFile(part.fileName, part.content, 'text/vcard;charset=utf-8');
            }
        }

        // Khởi tạo giao diện khi tải trang
        window.addEventListener('DOMContentLoaded', () => {
            renderCityFilters();
            renderProxies();
            updateContactBadges();
            renderContactCityFilters();
            renderContacts();
        });
    </script>
</body>
</html>
