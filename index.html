<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Lưu Trữ Proxy & Danh Bạ</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* Ẩn thanh cuộn ngang cho bộ lọc trên điện thoại */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Thanh cuộn tùy chỉnh cho danh sách dài */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Hỗ trợ vùng an toàn trên iPhone (tai thỏ / thanh home) */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col pb-20 sm:pb-0">

    <!-- Thông báo nổi (Toast Notification) tối ưu vị trí trên điện thoại -->
    <div id="toast" class="fixed bottom-24 sm:bottom-6 left-4 right-4 sm:left-auto sm:right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center justify-center sm:justify-start gap-3 bg-slate-900/95 backdrop-blur-md text-white px-4 py-3.5 rounded-2xl shadow-2xl border border-slate-700">
        <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        <span id="toast-message" class="text-sm font-medium truncate">Đã thực hiện thành công!</span>
    </div>

    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 sm:py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
                    </svg>
                </div>
                <div class="min-w-0">
                    <h1 class="text-base sm:text-xl font-bold text-slate-900 truncate">Kho Lưu Trữ Dữ Liệu</h1>
                    <p class="text-[11px] sm:text-xs text-slate-500 truncate">Proxy bảo mật & Danh bạ (.vcf)</p>
                </div>
            </div>

            <!-- Thanh chuyển đổi Tab trên máy tính / tablet -->
            <div class="hidden sm:flex bg-slate-100 p-1 rounded-xl">
                <button onclick="switchTab('proxies')" id="tab-proxies" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all bg-white text-indigo-600 shadow-sm">
                    Danh Sách Proxy (5)
                </button>
                <button onclick="switchTab('contacts')" id="tab-contacts" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-900">
                    Danh Bạ (<span id="tab-contacts-count">0</span> phần)
                </button>
            </div>
        </div>
    </header>

    <!-- Nội dung chính -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8">

        <!-- KHU VỰC PROXY -->
        <section id="section-proxies" class="space-y-4 sm:space-y-6">
            <!-- Bộ lọc khu vực Proxy: Cuộn ngang mượt trên điện thoại -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div id="proxy-city-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-3 px-3 sm:mx-0 sm:px-0">
                    <!-- Các nút lọc thành phố sẽ được render bằng JS -->
                </div>
                <button onclick="copyAllVisibleProxies()" class="w-full sm:w-auto justify-center px-4 py-3 sm:py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-sm transition-all flex items-center gap-2 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    <span>Sao chép tất cả đang hiển thị</span>
                </button>
            </div>

            <!-- Grid chứa các thẻ tệp Proxy -->
            <div id="proxies-container" class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6">
                <!-- Nội dung Proxy được render từ JS -->
            </div>
        </section>

        <!-- KHU VỰC DANH BẠ -->
        <section id="section-contacts" class="hidden space-y-4 sm:space-y-6">
            <!-- Bộ lọc khu vực & Chế độ chia danh bạ (≤ 20 số/phần) -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div id="contact-city-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-3 px-3 sm:mx-0 sm:px-0">
                    <!-- Các nút lọc khu vực danh bạ sẽ được render bằng JS -->
                </div>
                <div class="grid grid-cols-2 sm:flex bg-slate-200/70 p-1 rounded-xl shrink-0">
                    <button onclick="setContactMode('CITY')" id="mode-contact-city" class="px-3 py-2 sm:py-1.5 rounded-lg text-xs font-semibold transition-all bg-white text-blue-600 shadow-xs">
                        Theo khu vực (≤20)
                    </button>
                    <button onclick="setContactMode('ORIGINAL')" id="mode-contact-original" class="px-3 py-2 sm:py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-600 hover:text-slate-900">
                        Theo tệp gốc (≤20)
                    </button>
                </div>
            </div>

            <!-- Thanh tìm kiếm danh bạ tối ưu cho mobile (font 16px chống auto-zoom trên iOS) -->
            <div class="bg-white p-3.5 sm:p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row gap-3 justify-between items-stretch sm:items-center">
                <div class="relative w-full sm:w-96">
                    <svg class="w-5 h-5 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="contact-search" oninput="renderContacts()" placeholder="Tìm tên phần (vd: Buraydah 1), tên hoặc SĐT..." class="w-full pl-10 pr-4 py-3 sm:py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-base sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                </div>
                <div class="flex items-center justify-between sm:justify-end text-xs sm:text-sm text-slate-500 px-1">
                    <span class="sm:hidden">Hiển thị:</span>
                    <span>Tổng: <span id="total-contacts-count" class="font-bold text-slate-900">0</span> số (<span id="total-parts-count" class="font-bold text-blue-600">0</span> phần • tối đa 20 số/phần)</span>
                </div>
            </div>

            <!-- Grid chứa các phần danh bạ VCF -->
            <div id="contacts-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                <!-- Nội dung Danh bạ được render từ JS -->
            </div>
        </section>

    </main>

    <!-- Footer (ẩn trên mobile để nhường chỗ cho Bottom Nav) -->
    <footer class="hidden sm:block bg-white border-t border-slate-200 py-5 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
            Trang web lưu trữ cá nhân • Dữ liệu được đóng gói trực tiếp trong tệp HTML để truy cập nhanh mọi lúc, mọi nơi.
        </div>
    </footer>

    <!-- Thanh điều hướng dưới cùng (Bottom Navigation Bar) chuyên dụng cho Điện thoại -->
    <nav class="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.04)]">
        <div class="grid grid-cols-2 h-16">
            <button onclick="switchTab('proxies')" id="mobile-tab-proxies" class="flex flex-col items-center justify-center gap-1 text-indigo-600 font-semibold transition-colors active:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
                </svg>
                <span class="text-xs">Proxy (5 tệp)</span>
            </button>
            <button onclick="switchTab('contacts')" id="mobile-tab-contacts" class="flex flex-col items-center justify-center gap-1 text-slate-500 font-medium transition-colors active:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="text-xs">Danh Bạ (<span id="mobile-tab-contacts-count">0</span> phần)</span>
            </button>
        </div>
    </nav>
